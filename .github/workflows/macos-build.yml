name: Openguin macOS Universal2 Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, ci/0.12-stack-base]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openguin-universal2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-universal2:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust Universal2 targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Prepare runtime and assets once
        run: npm run desktop:prepare

      - name: Verify static source contracts
        run: npm run verify:all

      - name: Enforce whole-tree clean source invariant
        shell: bash
        run: |
          set -euo pipefail
          echo 'Static-source invariant: preparation may create ignored runtime resources, but it may not modify tracked source, docs, config, or assets.'
          if ! git diff --quiet; then
            echo 'Tracked files changed during desktop:prepare:'
            git status --short --untracked-files=no
            git diff --stat
            git diff
            exit 1
          fi
          echo 'Whole tracked tree is identical to the checked-in source after desktop:prepare.'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Universal2 app and DMG
        run: npx tauri build --target universal-apple-darwin

      - name: Verify Universal2 executable
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Openguin.app"
          EXE="$APP/Contents/MacOS/Openguin"
          test -d "$APP"
          test -x "$EXE"
          ARCHS="$(lipo -archs "$EXE")"
          echo "Architectures: $ARCHS"
          echo " $ARCHS " | grep -q " arm64 "
          echo " $ARCHS " | grep -q " x86_64 "
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f -print -quit | grep -q .

      - name: Upload Universal2 bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Openguin-Universal2-${{ github.sha }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
