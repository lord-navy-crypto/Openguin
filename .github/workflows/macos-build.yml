name: Openguin macOS Universal2 Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-universal2:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust Universal2 targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Prepare and verify source integrations
        run: |
          python3 scripts/apply-build-fixes.py
          python3 scripts/apply-full-logs.py
          python3 scripts/apply-observatory.py
          python3 scripts/apply-performance09.py
          python3 scripts/apply-task-center.py
          python3 scripts/apply-expansion010.py
          python3 scripts/apply-openguin-brand.py
          python3 scripts/ensure-app-icon.py
          python3 scripts/verify-desktop.py
          python3 scripts/verify-engineering011.py
          python3 scripts/verify-prepared-backend.py
          python3 scripts/verify-legacy-hardening011.py
          python3 scripts/verify-core-state011.py

      - name: Enforce clean prepared production source
        shell: bash
        run: |
          set -euo pipefail
          echo '0.11 invariant: prepare may verify production source but may not rewrite Rust/UI composition.'
          git diff --exit-code -- \
            src-tauri/src/lib.rs \
            src/App07.tsx \
            src/Observatory.tsx \
            src/SmartLab.tsx \
            src/FullLogs.tsx \
            src/EngineeringControl011.tsx \
            src/main.tsx
          echo 'Prepared Rust/UI source is identical to the checked-in source.'

      - name: Audit remaining build-time mutation
        shell: bash
        run: |
          echo 'Remaining tracked-source changes produced by legacy preparation:'
          git status --short
          git diff --stat -- README.md NOTICE.md COPYRIGHT.md CONTRIBUTING.md SECURITY.md docs || true
          echo 'Issue #2 now tracks only remaining docs/branding mutation before the whole-tree clean invariant.'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Universal2 app and DMG
        run: npm run desktop:build -- --target universal-apple-darwin

      - name: Verify Universal2 executable
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Openguin.app"
          EXE="$APP/Contents/MacOS/Openguin"
          test -d "$APP"
          test -x "$EXE"
          ARCHS="$(lipo -archs "$EXE")"
          echo "Architectures: $ARCHS"
          echo " $ARCHS " | grep -q " arm64 "
          echo " $ARCHS " | grep -q " x86_64 "
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f -print -quit | grep -q .

      - name: Upload Universal2 bundles
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Openguin-0.11-Engineering-Universal2-${{ github.sha }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
