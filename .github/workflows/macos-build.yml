name: Openguin macOS Universal2 Build

concurrency:
  group: openguin-universal2-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-universal2:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust Universal2 targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Verify source integrations
        run: |
          python3 scripts/apply-build-fixes.py
          python3 scripts/apply-full-logs.py
          python3 scripts/apply-observatory.py
          python3 scripts/apply-performance09.py
          python3 scripts/apply-task-center.py
          python3 scripts/apply-expansion010.py
          python3 scripts/apply-openguin-brand.py
          python3 scripts/ensure-app-icon.py
          python3 scripts/apply-network-observatory.py
          python3 scripts/verify-desktop.py

      - name: Install frontend dependencies
        run: npm install

      - name: Test browser network monitor and report parser
        run: |
          node --check browser-extension/background.js
          node --check browser-extension/monitor-main.js
          node --check browser-extension/monitor-bridge.js
          node --check browser-extension/popup.js
          node scripts/test-network-observatory.mjs

      - name: Verify network classifier and browser correlation before packaging
        run: |
          mkdir -p .network-test
          ./node_modules/.bin/esbuild src/browser-diagnostics.ts --bundle --platform=node --format=esm --outfile=.network-test/browser-diagnostics.mjs
          ./node_modules/.bin/esbuild src/network-one-click.ts --bundle --platform=node --format=esm --outfile=.network-test/network-one-click.mjs
          ./node_modules/.bin/esbuild src/network-correlation.ts --bundle --platform=node --format=esm --outfile=.network-test/network-correlation.mjs
          node --test tests/network-observatory.test.mjs tests/network-one-click.test.mjs tests/network-correlation.test.mjs

      - name: Build Universal2 app and DMG
        run: npm run desktop:build -- --target universal-apple-darwin

      - name: Verify Universal2 executable
        shell: bash
        run: |
          set -euo pipefail
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Openguin.app"
          EXE="$APP/Contents/MacOS/Openguin"
          test -d "$APP"
          test -x "$EXE"
          ARCHS="$(lipo -archs "$EXE")"
          echo "Architectures: $ARCHS"
          echo " $ARCHS " | grep -q " arm64 "
          echo " $ARCHS " | grep -q " x86_64 "
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f -print -quit | grep -q .

      - name: Package Network Watch extension and installation guide
        run: |
          # Vite/Tauri already use dist/ for the frontend, so keep downloadable
          # release files in a separate directory.
          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent browser-extension release-artifacts/Openguin-Network-Watch.zip
          cp LICENSE release-artifacts/LICENSE.txt
          cp THIRD_PARTY_NOTICES.md release-artifacts/THIRD_PARTY_NOTICES.md
          cat > release-artifacts/INSTALL-NETWORK-OBSERVATORY.txt <<'EOF'
          Openguin Network Observatory — macOS Universal2 installation

          1. Open the DMG and drag Openguin to Applications.
          2. Open Openguin and select Diagnostics / Network Observatory.
          3. Run Diagnose connection for DNS and HTTPS checks.
          4. Run Speed test for bounded download/upload and latency/jitter probes.
          5. Change VPN state manually, select the correct state, repeat tests,
             and save a sample. Openguin never changes VPN or DNS settings for you.

          Browser monitoring:
          1. Extract Openguin-Network-Watch.zip.
          2. In Chrome/Chromium, open Extensions and enable Developer mode.
          3. Choose Load unpacked and select the extracted browser-extension folder.
          4. Open the page to diagnose and click Start this tab in the extension.
          5. Optional ChatGPT reload monitoring needs separate host permission.
             Optional file-download monitoring needs downloads and alarms permissions.
             It records host/progress/bytes/stalls, not filenames or full URLs.

          Troubleshooting:
          - DNS failure: reconnect the active network/VPN, then repeat the check.
          - DNS succeeds but HTTPS fails: inspect routing, VPN, proxy/TLS filtering,
            firewall, or endpoint reachability.
          - HTTP 401/403/429 means the server responded; it is not a timeout.
          - A stream gap is a symptom, not proof of a particular cause.
          - Compare repeated VPN-on/off tests and change one setting at a time.

          This is an unsigned/unnotarized developer build. macOS may show a security
          warning. Only run it if you trust the source.
          EOF
          shasum -a 256 release-artifacts/* > release-artifacts/SHA256SUMS.txt
          ls -lh release-artifacts

      - name: Upload Universal2 DMG, app, extension, and guide
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Openguin-Network-Observatory-Universal2-${{ github.sha }}
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            release-artifacts/*
          if-no-files-found: error
          retention-days: 30
