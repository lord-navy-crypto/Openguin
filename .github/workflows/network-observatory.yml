name: Network Observatory checks

concurrency:
  group: network-observatory-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/browser-network-diagnostics
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  desktop-and-extension:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply desktop source patches without downloading the model runtime
        run: |
          python3 scripts/apply-build-fixes.py
          python3 scripts/apply-full-logs.py
          python3 scripts/apply-observatory.py
          python3 scripts/apply-performance09.py
          python3 scripts/apply-task-center.py
          python3 scripts/apply-expansion010.py
          python3 scripts/apply-openguin-brand.py
          python3 scripts/ensure-app-icon.py
          python3 scripts/apply-network-observatory.py

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Run deterministic browser diagnostics tests
        run: node scripts/test-network-observatory.mjs

      - name: Run browser report regression tests
        run: |
          mkdir -p .network-test
          ./node_modules/.bin/esbuild src/browser-diagnostics.ts --bundle --platform=node --format=esm --outfile=.network-test/browser-diagnostics.mjs
          node --test tests/network-observatory.test.mjs

      - name: Build frontend
        run: npm run build

      - name: Check native Rust commands
        run: |
          # Tauri validates this bundled resource path even during cargo check.
          # Keep the check lightweight: do not download or package the Ollama runtime.
          mkdir -p src-tauri/resources/ollama-runtime
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Validate extension JavaScript
        run: |
          node --check browser-extension/background.js
          node --check browser-extension/monitor-bridge.js
          node --check browser-extension/monitor-main.js
          node --check browser-extension/popup.js
          python3 -m json.tool browser-extension/manifest.json > /dev/null
