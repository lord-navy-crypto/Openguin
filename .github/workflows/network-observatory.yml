name: Network Observatory checks

concurrency:
  group: network-observatory-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/browser-network-diagnostics
      - feature/network-security-lab-v2
      - feature/security-toolbox-journal-app-monitor-v3
      - feature/defensive-mini-tools-v4
      - feature/defensive-mini-tools-v5
      - feature/defensive-mini-tools-v6
      - feature/local-defense-simulator-v7
      - feature/virtual-site-builder-v8
      - feature/localhost-manual-defense-lab-v9
      - feature/manual-defense-console-v10
      - feature/manual-http-workbench-v11
      - feature/ownership-security-lab-v12
      - feature/offline-defense-studio-v13
      - feature/manual-three-track-drills-v14
      - feature/defense-capacity-lab-v15
      - feature/manual-audit-evidence-v16
      - feature/browser-extension-local-lab-v17
      - feature/browser-observability-v18
  pull_request:
    branches:
      - main
      - feature/browser-network-diagnostics
      - feature/network-security-lab-v2
      - feature/security-toolbox-journal-app-monitor-v3
      - feature/defensive-mini-tools-v4
      - feature/defensive-mini-tools-v5
      - feature/defensive-mini-tools-v6
      - feature/local-defense-simulator-v7
      - feature/virtual-site-builder-v8
      - feature/localhost-manual-defense-lab-v9
      - feature/manual-defense-console-v10
      - feature/manual-http-workbench-v11
      - feature/ownership-security-lab-v12
      - feature/offline-defense-studio-v13
      - feature/manual-three-track-drills-v14
      - feature/defense-capacity-lab-v15
      - feature/manual-audit-evidence-v16
      - feature/browser-extension-local-lab-v17
  workflow_dispatch:

jobs:
  desktop-and-extension:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply desktop source patches without downloading the model runtime
        run: |
          python3 scripts/apply-build-fixes.py
          python3 scripts/apply-full-logs.py
          python3 scripts/apply-observatory.py
          python3 scripts/apply-performance09.py
          python3 scripts/apply-task-center.py
          python3 scripts/apply-expansion010.py
          python3 scripts/apply-openguin-brand.py
          python3 scripts/ensure-app-icon.py
          python3 scripts/apply-network-observatory.py

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Run deterministic browser diagnostics tests
        run: node scripts/test-network-observatory.mjs

      - name: Run browser report regression tests
        run: |
          mkdir -p .network-test
          ./node_modules/.bin/esbuild src/browser-diagnostics.ts --bundle --platform=node --format=esm --outfile=.network-test/browser-diagnostics.mjs
          node --test tests/network-observatory.test.mjs
          ./node_modules/.bin/esbuild src/network-security-analysis.ts --bundle --platform=node --format=esm --outfile=.network-test/network-security-analysis.mjs
          node --test tests/network-security-analysis.test.mjs
          ./node_modules/.bin/esbuild src/network-journal.ts --bundle --platform=node --format=esm --outfile=.network-test/network-journal.mjs
          node --test tests/network-journal.test.mjs
          ./node_modules/.bin/esbuild src/server-access-log.ts --bundle --platform=node --format=esm --outfile=.network-test/server-access-log.mjs
          node --test tests/server-access-log.test.mjs
          ./node_modules/.bin/esbuild src/security-evidence-correlation.ts --bundle --platform=node --format=esm --outfile=.network-test/security-evidence-correlation.mjs
          node --test tests/security-evidence-correlation.test.mjs
          ./node_modules/.bin/esbuild src/defensive-header-audit.ts --bundle --platform=node --format=esm --outfile=.network-test/defensive-header-audit.mjs
          node --test tests/defensive-header-audit.test.mjs
          ./node_modules/.bin/esbuild src/defense-action-plan.ts --bundle --platform=node --format=esm --outfile=.network-test/defense-action-plan.mjs
          node --test tests/defense-action-plan.test.mjs
          ./node_modules/.bin/esbuild src/defensive-mini-tools.ts --bundle --platform=node --format=esm --outfile=.network-test/defensive-mini-tools.mjs
          node --test tests/defensive-mini-tools.test.mjs
          ./node_modules/.bin/esbuild src/defensive-auditors-v5.ts --bundle --platform=node --format=esm --outfile=.network-test/defensive-auditors-v5.mjs
          node --test tests/defensive-auditors-v5.test.mjs
          ./node_modules/.bin/esbuild src/defensive-lints-v6.ts --bundle --platform=node --format=esm --outfile=.network-test/defensive-lints-v6.mjs
          node --test tests/defensive-lints-v6.test.mjs
          ./node_modules/.bin/esbuild src/local-defense-simulator.ts --bundle --platform=node --format=esm --outfile=.network-test/local-defense-simulator.mjs
          node --test tests/local-defense-simulator.test.mjs
          ./node_modules/.bin/esbuild src/virtual-site-builder-v8.ts --bundle --platform=node --format=esm --outfile=.network-test/virtual-site-builder-v8.mjs
          node --test tests/virtual-site-builder-v8.test.mjs
          ./node_modules/.bin/esbuild src/network-one-click.ts --bundle --platform=node --format=esm --outfile=.network-test/network-one-click.mjs
          node --test tests/network-one-click.test.mjs
          ./node_modules/.bin/esbuild src/network-correlation.ts --bundle --platform=node --format=esm --outfile=.network-test/network-correlation.mjs
          node --test tests/network-correlation.test.mjs
          ./node_modules/.bin/esbuild src/network-history.ts --bundle --platform=node --format=esm --outfile=.network-test/network-history.mjs
          node --test tests/network-history.test.mjs
          ./node_modules/.bin/esbuild src/network-retest.ts --bundle --platform=node --format=esm --outfile=.network-test/network-retest.mjs
          node --test tests/network-retest.test.mjs
          ./node_modules/.bin/esbuild src/diagnostic-export.ts --bundle --platform=node --format=esm --outfile=.network-test/diagnostic-export.mjs
          node --test tests/diagnostic-export.test.mjs

      - name: Test isolated manual localhost HTTP lab
        run: npm run security:lab:test

      - name: Build frontend
        run: npm run build

      - name: Check native Rust commands
        run: |
          # Tauri validates this bundled resource path even during cargo check.
          # Keep the check lightweight: do not download or package the Ollama runtime.
          mkdir -p src-tauri/resources/ollama-runtime
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Validate extension JavaScript
        run: |
          node --check browser-extension/background.js
          node --check browser-extension/monitor-bridge.js
          node --check browser-extension/monitor-main.js
          node --check browser-extension/lab-compat.js
          node --check browser-extension/observability-v18.js
          node --check browser-extension/popup.js
          node --test tests/extension-bridge.test.mjs tests/extension-background.test.mjs tests/extension-monitor.test.mjs tests/extension-journal.test.mjs tests/extension-local-lab-v17.test.mjs tests/extension-observability-v18.test.mjs
          python3 -m json.tool browser-extension/manifest.json > /dev/null

      - name: Package browser extension
        run: |
          mkdir -p release-artifacts
          cd browser-extension
          zip -qr ../release-artifacts/Openguin-Network-Watch.zip manifest.json popup.html popup.js lab-compat.js observability-v18.js background.js monitor-bridge.js monitor-main.js README.md

      - name: Upload browser extension package
        uses: actions/upload-artifact@v4
        with:
          name: Openguin-Network-Watch
          path: release-artifacts/Openguin-Network-Watch.zip
          if-no-files-found: error
          retention-days: 30
