name: OpenPenguin LabBridge Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - feature/labbridge-v1
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/src/main.rs'
      - 'src-tauri/src/labbridge_server.rs'
      - 'docs/LABBRIDGE_V1.md'
      - '.github/workflows/labbridge-integrity.yml'
  pull_request:
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/src/main.rs'
      - 'src-tauri/src/labbridge_server.rs'
      - 'docs/LABBRIDGE_V1.md'
      - '.github/workflows/labbridge-integrity.yml'

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Isolate backend compile from desktop packaging assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('src-tauri/tauri.conf.json')
          config = json.loads(path.read_text(encoding='utf-8'))
          bundle = config.setdefault('bundle', {})
          bundle['active'] = False
          bundle['icon'] = []
          bundle['resources'] = {}
          path.write_text(json.dumps(config, indent=2), encoding='utf-8')
          PY
      - name: Check native LabBridge backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Verify port and route separation
        run: |
          grep -q '127.0.0.1:11436' src-tauri/src/labbridge_server.rs
          grep -q '127.0.0.1:11435' src-tauri/src/labbridge_server.rs
          grep -q '/labbridge/v1/health' src-tauri/src/labbridge_server.rs
          grep -q '/labbridge/v1/capabilities' src-tauri/src/labbridge_server.rs
          grep -q '/labbridge/v1/advisory' src-tauri/src/labbridge_server.rs
          grep -q 'executed: false' src-tauri/src/labbridge_server.rs
