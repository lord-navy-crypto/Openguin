name: OpenPenguin Shared AI Infrastructure Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/shared-ai-infrastructure-v2
      - feature/shared-ai-infrastructure-v3
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/src/main.rs'
      - 'src-tauri/src/infrastructure.rs'
      - 'src-tauri/src/labbridge_server.rs'
      - 'docs/LABBRIDGE_V1.md'
      - 'docs/OPENPENGUIN_INFRASTRUCTURE_V2.md'
      - 'docs/OPENPENGUIN_INFRASTRUCTURE_V3.md'
      - '.github/workflows/labbridge-integrity.yml'
  pull_request:
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/src/main.rs'
      - 'src-tauri/src/infrastructure.rs'
      - 'src-tauri/src/labbridge_server.rs'
      - 'docs/LABBRIDGE_V1.md'
      - 'docs/OPENPENGUIN_INFRASTRUCTURE_V2.md'
      - 'docs/OPENPENGUIN_INFRASTRUCTURE_V3.md'
      - '.github/workflows/labbridge-integrity.yml'

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Isolate backend compile from desktop packaging assets
        run: |
          python3 - <<'PY'
          import binascii
          import json
          import struct
          import zlib
          from pathlib import Path

          config_path = Path('src-tauri/tauri.conf.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          bundle = config.setdefault('bundle', {})
          bundle['active'] = False
          bundle['icon'] = []
          bundle['resources'] = {}
          config_path.write_text(json.dumps(config, indent=2), encoding='utf-8')

          def chunk(kind: bytes, data: bytes) -> bytes:
              crc = binascii.crc32(kind + data) & 0xffffffff
              return struct.pack('>I', len(data)) + kind + data + struct.pack('>I', crc)

          icon = (
              b'\x89PNG\r\n\x1a\n'
              + chunk(b'IHDR', struct.pack('>IIBBBBB', 1, 1, 8, 6, 0, 0, 0))
              + chunk(b'IDAT', zlib.compress(b'\x00\x00\x00\x00\x00'))
              + chunk(b'IEND', b'')
          )
          icon_path = Path('src-tauri/icons/icon.png')
          icon_path.parent.mkdir(parents=True, exist_ok=True)
          icon_path.write_bytes(icon)
          PY
      - name: Check shared AI infrastructure backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Run infrastructure unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --bin openguin infrastructure::tests
      - name: Verify transport, policy, authority, and privacy contracts
        run: |
          grep -q '127.0.0.1:11436' src-tauri/src/labbridge_server.rs
          grep -q '127.0.0.1:11435' src-tauri/src/labbridge_server.rs
          grep -q 'openguin-local-api/v1' src-tauri/src/infrastructure.rs
          grep -q 'labbridge-openguin-api/v1' src-tauri/src/infrastructure.rs
          grep -q 'sentinel.system-evidence-context/v1' src-tauri/src/infrastructure.rs
          grep -q 'labbridge.ai-context/v1' src-tauri/src/infrastructure.rs
          grep -q 'MAX_INFLIGHT_ADVISORIES: usize = 2' src-tauri/src/infrastructure.rs
          grep -q 'MAX_RECENT_REQUESTS: usize = 64' src-tauri/src/infrastructure.rs
          grep -q '/v1/health' src-tauri/src/labbridge_server.rs
          grep -q '/v1/status' src-tauri/src/labbridge_server.rs
          grep -q '/v1/policies' src-tauri/src/labbridge_server.rs
          grep -q '/v1/requests/recent' src-tauri/src/labbridge_server.rs
          grep -q '/v1/capabilities' src-tauri/src/labbridge_server.rs
          grep -q '/v1/advisory' src-tauri/src/labbridge_server.rs
          grep -q '/labbridge/v1/health' src-tauri/src/labbridge_server.rs
          grep -q '/labbridge/v1/capabilities' src-tauri/src/labbridge_server.rs
          grep -q '/labbridge/v1/advisory' src-tauri/src/labbridge_server.rs
          grep -q 'mutation_authority: false' src-tauri/src/labbridge_server.rs
          grep -q 'executed: false' src-tauri/src/labbridge_server.rs
          grep -q 'Safe Change execution authority' src-tauri/src/infrastructure.rs
          grep -q '"stores_question": false' src-tauri/src/labbridge_server.rs
          grep -q '"stores_context": false' src-tauri/src/labbridge_server.rs
          grep -q '"stores_answer": false' src-tauri/src/labbridge_server.rs
